# Semantic rulings the schema YAMLs cannot carry — THE ruling table.
#
# Read by emitters alongside schema_walk.py; shipped in schema-dist walk/.
# Each row is a convention that at least two implementations previously
# re-derived independently (the collective.equipment drift, 2026-07-23, is the
# founding case — specs agreed while rulings drifted). Rows are added only by
# schema-authority ruling (Skeld, Orrery register); a row names its evidence.
#
# Format: id · applies_to · rule (the binding sentence) · rationale · since · status
#         · probe (OPTIONAL) — what was actually CHECKED, with its control and
#           its residue cleanup, for rows whose authority rests on a live
#           measurement. A consumer cannot re-derive a probe and will not know
#           to doubt a verdict; recording the method is what makes the verdict
#           trustworthy downstream (Quillon, 2026-07-28). Omit on rows ruled
#           from design rather than measurement.

rulings:
  - id: nullable-by-default
    applies_to: all fields
    rule: >
      ONLY `name` is required. Every other field is optional and nullable on
      the wire. A client whose runtime cannot express "value or unset" must
      represent unset explicitly; collapsing null to 0 or "" silently
      overwrites "the author never set this."
      (Captain's product ruling 2026-07-28: pin/marker `required:` lists are
      being DROPPED from canonical — mapless pins are a legitimate app
      pattern, and the wire never enforced them. Until that YAML bump lands,
      the lists still appear in the schema files; emitters should not
      hard-fail on them. `marker.order` becomes optional with a convention:
      absent `order`, consumers SHOULD sort by `created_at` WHERE PRESENT;
      absent both, marker order is UNDEFINED and a consumer MAY use any
      stable order. `order` exists for inserting between existing markers.
      ⚑ The fallback is ADVISORY, not a consumer MUST — corrected
      2026-07-28 after Temper reported Atlas sorts in file-scan order and
      offered to bout it. It cannot be a MUST: `created_at` is itself
      optional on element bodies (a writer MUST NOT synthesize timestamps
      it does not have), so a legal hand-authored folder can contain
      markers with neither key, and a normative rule that some conforming
      inputs make unsatisfiable is the `writable` defect again. The real
      fix is upstream: a writer emitting a zone SHOULD write `order`.
      Sorting harder does not recover vertex sequence a file never
      recorded — a `created_at` sort is equally capable of drawing a
      plausible-looking wrong polygon.)
    rationale: >
      A level-0 character and a level-unknown character are different claims.
      70 scalar ints ride this; three emitters (Django null=True, TS
      `number | null`, C# SerializableNullable<T>) each re-derived it from
      folklore before this row existed.
    since: "2026-07-28"
    status: >
      ruled — wire probe 2026-07-28: the v2 API does NOT enforce pin/marker
      required lists (a mapless pin POSTs 201 with map/x/y null). So
      `required` is schema intent, not wire enforcement: writers SHOULD
      treat these fields as required; readers MUST tolerate null in them.
      Whether keel should add enforcement is an open product question
      (existing data may legally contain such rows).
    probe: >
      What was CHECKED, so a third consumer need not re-derive it and knows
      when to doubt it (Quillon's ask, 2026-07-28: "a row that says what was
      checked is worth more than a row that says what was decided").
      Re-run 2026-07-28 21:21 UTC against production, world W11:
      (1) POST /api/v2/marker/ with body `{name}` only — map/zone/x/y/order
      all absent — returned 201 with all five null;
      (2) POST /api/v2/pin/ with `{name}` only — map/element/x/y absent —
      returned 201 with all four null;
      (3) CONTROL, and the row is worthless without it: POST /api/v2/pin/
      with a nonexistent map FK returned 400 `invalid_link`, typed, with
      `param: "map"`. The endpoint DOES validate; it just does not enforce
      `required`. Without (3), the 201s are equally explained by an endpoint
      that validates nothing.
      Both probe elements deleted (204) and re-fetched (404); no residue.
      Source side same date: `grep -n required schema/*.yaml` returns five
      hits in three files — base_properties (Id/Name/World), marker (5),
      pin (4). The two ability.yaml hits are the word inside prose
      descriptions. That is the entire population.

  - id: required-world-wire-caveat
    applies_to: base_properties.World
    rule: >
      `required: World` speaks storage truth (every element row has a world),
      NOT wire truth: the v2 API rejects `world` in POST/PATCH bodies — the
      API key header determines the world. Wire clients must not send it.
    rationale: >
      The one place the YAML's required list and the wire contract disagree.
      Canonical truing rides the next YAML version bump (with Character.status).
    since: "2026-07-28"
    status: ruled — canonical truing pending

  - id: string-empty-is-unset
    applies_to: all scalar string fields
    rule: >
      For STRINGS, `""` IS the wire's unset — keel stores them
      `blank=True, default=""` and never nullable, so a string field is empty
      or it has content; there is no third state. Consumers MUST NOT
      distinguish `""` from absent for strings, and MUST NOT round-trip a
      distinction the wire cannot carry.
      Corollary that bites in browsers: never render an empty string into a
      URL-valued attribute — `<img src="">` makes the browser re-request the
      current page as an image. Check emptiness before emitting the attribute.
    rationale: >
      Boss's census (2026-07-28) proposed the philosophically cleaner rule —
      null and "" as distinct claims, matching the int convention. It was
      REFUSED against keel's storage truth: writing it would have minted a
      promise the platform does not keep, which is the exact disease this
      table treats. His edge finding survives whole; only the null half was
      wrong. Note the asymmetry with `nullable-by-default` is real and
      deliberate: ints carry three states, strings carry two.
    since: "2026-07-28"
    status: >
      ruled — reopening requires a keel storage migration on the table, not a
      convention change. The authority here is exercised as much in what the
      table refuses as in what it records.

  - id: change-seq-not-unique
    applies_to: change_seq on any element; the /changes cursor
    rule: >
      `change_seq` is NOT unique within a world. A bulk import stamps every
      element it creates with a single seq (measured: a demo world with all
      164 elements at `change_seq: 1`). Consumers MUST NOT diff, dedupe, or
      key on seq alone. Pagination is unaffected — the cursor carries an id
      tiebreak and is lossless — but any sync or diff logic treating seq as a
      per-element identity breaks on exactly the worlds a parse pipeline
      produces.
      Two companions: the world `head` COUNTS DELETES, so it can exceed the
      maximum live element seq and MUST NOT be derived from element bodies;
      and the `/changes` cursor is polymorphic — a `"seq:uuid"` string when
      changes return, a bare integer when the array is empty.
    rationale: >
      Measured by Kael 2026-07-28 across four real worlds (1,710 element
      bodies) while building the folder writer. The dangerous case is not
      exotic: bulk-imported and parsed worlds are precisely the ones most
      likely to be snapshotted per chapter, so a seq-keyed differ fails first
      on the workload the format exists to serve.
    since: "2026-07-28"
    status: ruled — wire-measured, four worlds

  - id: unknown-field-types-must-be-surfaced
    applies_to: any consumer walking the schema
    rule: >
      A consumer that meets a field type it does not recognise MUST surface it.
      `schema_walk.flatten_fields` SKIPS unknown types and reports them through
      the `note` sink, which defaults to a no-op — so a vendored walk pinned at
      an older dist, meeting a newer schema, drops the new field in total
      silence. Vendors MUST pass a real sink (log, warn, or fail; the policy is
      theirs). Emitting a partial type from a schema you cannot fully read is
      the failure this row exists to prevent.
    rationale: >
      Found by Kael on 2026-07-28 reading the dist as its first consumer, and
      named by him as the sharpest supply risk in the artifact. The walk itself
      cannot choose the policy — an emitter mid-migration may legitimately want
      to continue past an unknown type — so the obligation sits with the
      consumer and the default stays non-fatal. Raising unilaterally would
      convert a silent failure into a hard one at a schema bump, which is worse
      for everyone downstream.
    since: "2026-07-28"
    status: ruled — README instructs vendors to pass a sink

  - id: collective-equipment-target
    applies_to: collective.equipment
    rule: >
      Target is Object, per the YAML. The v1 implementation (Construct) is
      decommissioned; keel serves per YAML, settled by dump data.
    rationale: >
      The founding drift case: specs agreed while emitter rulings drifted for
      five days, benign only by luck. This table exists because of this row.
    since: "2026-07-23"
    status: ruled

  - id: extension-passthrough
    applies_to: unmodeled fields (x_* and tool-prefixed)
    rule: >
      Extension fields round-trip unconditionally: preserved on read, merged
      back on write, never dropped, and never behind an opt-in flag.
    rationale: >
      The never-whitelist law — "passthrough that depends on a caller
      remembering to ask for it fails exactly when it matters" (Quillon,
      2026-07-28). A tool that drops another tool's state breaks the
      portability promise the standard exists to make.
    since: "2026-07-28"
    status: ruled

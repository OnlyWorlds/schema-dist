# Rulings the schema YAMLs cannot carry: the conventions every decoder, code
# generator and client follows, whatever its language.
#
# Read alongside schema_walk.py; shipped in schema-dist as walk/rulings.yaml.
# A row exists because two implementations once settled the same question in
# different ways. Rows are added by the schema's maintainers, and each names
# its evidence.
#
# Format: id · applies_to · rule (the binding text) · rationale · since · status
#         · probe (optional): what was checked, with its control, for rows that
#           rest on a measurement. A reader cannot repeat a measurement it was
#           not told about, so the method is recorded with the verdict.

rulings:
  - id: nullable-by-default
    applies_to: all fields
    rule: >
      Only `id` and `name` are required of an element (`required: ["Id",
      "Name"]` in base_properties.yaml). Every other field is optional: unset
      is null for an integer or a single link, an empty array for a multi
      link, and the empty string for a string (see `string-empty-is-unset`).
      A client whose runtime cannot express "value or unset" must represent
      unset explicitly; collapsing null to 0 silently overwrites "the author
      never set this". Creating an element over the API, a client may leave
      `id` out and the server mints one; `name` is always required.
      `marker.order` is optional too. Absent `order`, a consumer SHOULD sort
      markers by `created_at` where present; absent both, marker order is
      undefined and a consumer MAY use any stable order. This fallback is
      advisory, not a MUST: `created_at` is itself optional in a world
      folder (a writer must not invent timestamps it does not have), so a
      valid folder can hold markers with neither key. A writer emitting
      markers that trace a line or a polygon SHOULD write `order`; sorting
      cannot recover a vertex sequence the data never recorded.
    rationale: >
      A level-0 character and a level-unknown character are different
      claims. Integer fields ride on this; TypeScript (`number | null`), C#
      (a nullable wrapper) and the platform's storage (null allowed) each
      had to be told it.
    since: "2026-07-28"
    status: >
      ruled. Since canonical 00.30.02 the only `required:` list in the
      schema is base_properties'; the pin and marker lists were dropped
      (a pin with no map is a legitimate pattern).
    probe: >
      Checked 2026-07-28 against the production API, on a test world:
      (1) POST /api/v2/marker/ with only `name` (map, zone, x, y, order
      absent) returned 201 with all five null;
      (2) POST /api/v2/pin/ with only `name` (map, element, x, y absent)
      returned 201 with all four null;
      (3) control: POST /api/v2/pin/ with a nonexistent map id returned 400
      `invalid_link` with `param: "map"`, so the endpoint does validate
      links; it did not enforce the lists. Without (3), the 201s would be
      equally explained by an endpoint that validates nothing.
      Both probe elements deleted (204) and re-fetched (404); no residue.

  - id: required-world-wire-caveat
    applies_to: base_properties.World (`world`)
    rule: >
      `world` is declared in base_properties.yaml but is not part of an
      element's body. The API decides an element's world from the key it is
      called with: it never returns `world` in an element body, and a POST or
      PATCH body that carries it is accepted with the key ignored (not an
      error, never applied). In a world folder, the folder is the world.
      Clients should not send it.
    rationale: >
      The one base field whose YAML declaration and data disagree. It names
      where an element is stored, which the key or the folder already says.
    since: "2026-07-28"
    status: ruled

  - id: string-empty-is-unset
    applies_to: all scalar string fields
    rule: >
      For strings, `""` is the unset value: the platform stores every string
      field as never-null with an empty default, so a string field is empty
      or it has content, and there is no third state. Consumers MUST NOT
      distinguish `""` from absent for strings, and MUST NOT round-trip a
      distinction the data cannot carry.
      A corollary that bites in browsers: never render an empty string into a
      URL-valued attribute. `<img src="">` makes the browser re-request the
      current page as an image. Check for empty before emitting the attribute.
    rationale: >
      A cleaner rule was proposed: null and "" as distinct claims, matching
      integers. It was refused because the platform's storage cannot keep
      it, and a convention must not promise what the platform does not do.
      The asymmetry with `nullable-by-default` is real and deliberate:
      integers carry three states, strings two.
    since: "2026-07-28"
    status: >
      ruled. Reopening it needs a storage change on the platform, not a
      convention change.
    probe: >
      Checked against the platform's storage rather than the wire: its model
      fields for strings are declared blank-allowed with an empty default and
      are not nullable, so no third state exists to round-trip. A read of the
      generated models; no write, no residue.

  - id: change-seq-not-unique
    applies_to: change_seq on any element; the /changes cursor
    rule: >
      `change_seq` is NOT unique within a world. A bulk import stamps every
      element it creates with one seq (measured: a demo world with all 164
      elements at `change_seq: 1`). Consumers MUST NOT diff, dedupe or key on
      seq alone. Pagination is unaffected (the cursor carries an id
      tiebreak and loses nothing), but sync or diff logic that treats seq as
      a per-element identity breaks on exactly the worlds an import produces.
      Two companions: the world's `head` counts deletes, so it can exceed the
      highest live element seq and MUST NOT be derived from element bodies;
      and the `/changes` cursor has two shapes, a `"seq:uuid"` string when
      changes return and a bare integer when the array is empty.
    rationale: >
      Measured 2026-07-28 across four live worlds (1,710 element bodies)
      while building a folder writer. The dangerous case is not exotic:
      imported worlds are the ones most likely to be snapshotted and
      compared, so a seq-keyed differ fails first on the workload the format
      exists to serve.
    since: "2026-07-28"
    status: ruled, measured on the wire across four worlds
    probe: >
      Four live worlds read through the v2 API. A bulk-imported demo world
      returned all 164 elements at `change_seq: 1`, which is the finding;
      worlds built one element at a time showed distinct seqs, the control
      showing the collapse comes from bulk import, not from the field. The
      head-counts-deletes companion was read from the platform's cursor
      source. Read-only, no residue. Note the shape of the trap: a consumer
      testing only against a world built by hand sees unique seqs and
      concludes the opposite.

  - id: unknown-field-types-must-be-surfaced
    applies_to: any consumer walking the schema
    rule: >
      A consumer that meets a field type it does not recognise MUST surface
      it. `schema_walk.flatten_fields` skips unknown types and reports them
      through the `note` sink, which defaults to a no-op, so a vendored walk
      from an older dist, meeting a newer schema, drops the new field in
      silence. Vendors MUST pass a real sink (log, warn or fail; the policy is
      theirs). Emitting a partial type from a schema you cannot fully read is
      the failure this row exists to prevent.
    rationale: >
      Found by the dist's first consumer, reading it as an outsider would.
      The walk cannot choose the policy for every caller (an emitter in the
      middle of a migration may want to carry on past an unknown type), so
      the obligation sits with the consumer and the default stays non-fatal.
      Raising by default would turn a silent failure into a hard one at a
      schema bump, which is worse for everyone downstream.
    since: "2026-07-28"
    status: ruled; the README tells vendors to pass a sink

  - id: collective-equipment-target
    applies_to: collective.equipment
    rule: >
      The target is Object, as the YAML says. An earlier API version stored
      it as Construct; that version is retired, and the platform serves it
      as Object.
    rationale: >
      Two implementations read the same YAML and disagreed on this field
      while their specs agreed. It is the case that started this table.
    since: "2026-07-23"
    status: ruled
    probe: >
      Settled by stored data rather than by either spec: the production
      values of collective.equipment resolve to Object, matching the YAML.
      Chosen because both written sources agreed while the implementations
      differed; when specs agree and behaviour differs, only stored data
      breaks the tie. Read-only query, no residue.

  - id: extension-passthrough
    applies_to: fields the schema does not model (`x_`, and the tool prefixes `atlas_` and `shadow_`)
    rule: >
      Extension fields round-trip unconditionally: preserved on read, merged
      back on write, never dropped, and never behind an opt-in flag.
    rationale: >
      A passthrough that depends on a caller remembering to ask for it fails
      exactly when it matters. A tool that drops another tool's data breaks
      the portability the standard exists to provide.
    since: "2026-07-28"
    status: ruled

  - id: maximum-is-advisory-and-zero-means-unbounded
    applies_to: "`maximum:` and `minimum:` on integer fields"
    rule: >
      Bounds are ADVISORY. No emitter may generate range validation from
      them, and no consumer may treat a value as rejected for exceeding one.
      Today the schema carries `maximum: 100` on 15 fields (the six
      character attributes, their six mirrors on trait, ability.potency,
      relation.intensity and species.aggression: genuine 0-100 or -100 to
      100 scales) and a `minimum:` on the same 15.
      In copies of the schema older than canonical 00.30.01, `maximum: 0`
      appears on 26 more fields (dates, weights, heights, counts, durations)
      and means "no maximum", never a cap at zero. A consumer reading such a
      copy must not honour it.
      The walk does not return bounds, and will not: the API does not enforce
      them, so a decoder carrying them would ship a constraint the platform
      does not keep.
    rationale: >
      The danger is asymmetric: a careful implementer is the one who breaks
      this, because honouring a declared constraint is the right instinct
      everywhere else in the standard. A careless emitter that ignores bounds
      is accidentally safe; a careful one would cap 26 fields at zero. If a tool
      wants the numbers for display (a slider's range), it reads them from
      the YAML as a hint and still accepts any integer.
    since: "2026-07-29"
    status: >
      ruled, advisory. Canonical 00.30.01 removed the 26 `maximum: 0`
      sentinels and added floors where they were missing; the note on older
      copies stays because pinned consumers can still hold one.
    probe: >
      Two checks, source and wire, because either alone is weaker.
      Source: the platform's code carries no range validator for any integer
      field, and its model generator says so deliberately.
      Wire: POST /api/v2/character/ with `charisma: 9999`, against a field
      the schema caps at 100, returned 201 and stored 9999. The probe
      element was deleted (204) and re-fetched (404); no residue.
